<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Memory Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: a pipeline rail on the left (senses to long-term memory), one lab station at a time on the right. */
  --bg:#F3F8F7; --surface:#FFFFFF; --ink:#2B2D2F; --ink-2:#566063; --line:#D0E0DE;
  --btn:#0E7C7B; --btn-hover:#0B6665; --accent:#0B6665; --soft:#E3F2F1;
  --gold:#C9A94E; --gold-soft:#F3EACB; --gold-ink:#6F5A1B;
  --good:#1B7F4B; --good-soft:#E1F3E8; --bad:#B3402F; --bad-soft:#F8E4E0;
  --screen:#18292B; --screen-ink:#E8F6F5;
  --f-display:"Bricolage Grotesque",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141819; --surface:#1E2324; --ink:#E7EFEE; --ink-2:#A8B6B5; --line:#33403F;
    --btn:#0E7C7B; --btn-hover:#12908F; --accent:#5CCFCD; --soft:#1C3433;
    --gold:#D8BC62; --gold-soft:#3A3319; --gold-ink:#E3CD84;
    --good:#58C98B; --good-soft:#1B3427; --bad:#F08A78; --bad-soft:#3E2220;
    --screen:#0C1718; --screen-ink:#E8F6F5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141819; --surface:#1E2324; --ink:#E7EFEE; --ink-2:#A8B6B5; --line:#33403F;
  --btn:#0E7C7B; --btn-hover:#12908F; --accent:#5CCFCD; --soft:#1C3433;
  --gold:#D8BC62; --gold-soft:#3A3319; --gold-ink:#E3CD84;
  --good:#58C98B; --good-soft:#1B3427; --bad:#F08A78; --bad-soft:#3E2220;
  --screen:#0C1718; --screen-ink:#E8F6F5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 18px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);line-height:1.1;text-wrap:balance;margin:0;color:var(--ink)}
h1{font-size:clamp(48px,9vw,92px);font-weight:800;letter-spacing:-.02em;color:var(--accent)}
h2{font-size:clamp(30px,4.5vw,44px);font-weight:800}
h3{font-size:22px;font-weight:700;margin-bottom:8px}
p{margin:0 0 12px}
a{color:var(--accent)}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font:700 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;padding:28px 20px;border-right:1px solid var(--line);background:var(--surface);overflow:auto}
.brand{display:block;font:800 24px var(--f-display);color:var(--accent);text-decoration:none;margin-bottom:4px}
.rail .sub{font-size:14px;color:var(--ink-2);margin-bottom:24px}
.rail ol{list-style:none;margin:0;padding:0;position:relative}
.rail ol::before{content:"";position:absolute;left:15px;top:16px;bottom:16px;width:2px;background:var(--line)}
.rail li a{display:flex;gap:12px;align-items:center;padding:8px 0;color:var(--ink-2);text-decoration:none;font-weight:700;font-size:16px;position:relative}
.rail .dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font:700 14px var(--f-display);z-index:1;flex:none}
.rail li.done .dot{background:var(--btn);border-color:var(--btn);color:#fff}
.rail li.current .dot{border-color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.rail li.current a{color:var(--ink)}
.rail .prog{margin-top:24px;font-size:14px;color:var(--ink-2)}

main{padding:40px clamp(16px,5vw,64px) 96px;max-width:1000px;width:100%}
.hero{padding:12px 0 8px}
.lede{font-size:21px;max-width:60ch;margin:16px 0 20px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0}
.st-head{display:flex;gap:20px;align-items:flex-end;margin-bottom:20px}
.num{font:800 clamp(72px,13vw,140px)/.78 var(--f-display);color:var(--accent);opacity:.92;letter-spacing:-.04em}
.prose{max-width:66ch}
.panel,.lab{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin:20px 0}
.lab{border-left:6px solid var(--btn)}
.lab h3 .tag{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;background:var(--soft);color:var(--accent);padding:3px 8px;border-radius:6px;margin-right:8px;vertical-align:middle}
.depth{background:var(--soft);border-radius:14px;padding:20px 24px;margin:20px 0}
.depth h3{color:var(--accent)}
.gold-note{border-left:5px solid var(--gold);background:var(--gold-soft);padding:12px 16px;border-radius:0 10px 10px 0;color:var(--ink);margin:16px 0}

.btn{appearance:none;border:2px solid var(--btn);background:var(--btn);color:#fff;font:700 16px var(--f-body);padding:11px 20px;border-radius:10px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--btn)}
.btn.ghost:hover{background:var(--soft)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:96px;resize:vertical}
input[type=range]{accent-color:var(--btn)}
input:focus,textarea:focus,select:focus{border-color:var(--btn);outline:none}
label{font-weight:700;display:block;margin:8px 0 4px}
.inline-in{max-width:360px}
.mono{font-family:var(--f-mono)}

.screen{background:var(--screen);color:var(--screen-ink);border-radius:12px;min-height:200px;display:grid;place-items:center;font:500 22px var(--f-mono);padding:18px;text-align:center;margin:12px 0}
.screen.big{font-size:clamp(40px,9vw,72px);font-weight:600;letter-spacing:.08em}
.screen small{display:block;font:400 16px var(--f-body);color:#A9C7C5;margin-top:8px;letter-spacing:0}
.g{display:grid;grid-template-columns:repeat(4,minmax(0,64px));gap:10px;justify-content:center}
.g span{height:60px;display:grid;place-items:center;font:600 32px var(--f-mono);border-radius:8px;background:rgba(255,255,255,.07)}
.g span.cue{outline:3px solid var(--gold);background:rgba(201,169,78,.22)}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.timer i{display:block;height:100%;width:100%;background:var(--gold)}
.clock{font:600 20px var(--f-mono);color:var(--gold-ink)}
.out{margin-top:12px;font-weight:700}
.big{font:800 52px var(--f-display);color:var(--accent);margin:0}

.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--btn)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
fieldset.q{border:0;padding:0;margin:0 0 24px}
fieldset.q legend{font-weight:700;padding:0;margin-bottom:6px}
.fb{margin:6px 0 0;min-height:1em}
.fb b.ok{color:var(--good)} .fb b.no{color:var(--bad)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-top:8px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink-2);font:700 16px var(--f-body);padding:10px 16px;border-radius:10px 10px 0 0;cursor:pointer}
.tab[aria-selected="true"]{background:var(--btn);color:#fff}

.map{display:grid;gap:10px;margin:24px 0}
.map a{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;text-decoration:none;color:var(--ink)}
.map a:hover{border-color:var(--btn)}
.map .n{font:800 36px var(--f-display);color:var(--accent)}
.map b{font:700 20px var(--f-display);display:block}
.map span.d{color:var(--ink-2);font-size:16px}
.pill{font:700 13px var(--f-body);border-radius:999px;padding:4px 10px;background:var(--soft);color:var(--accent);white-space:nowrap}
.pill.done{background:var(--btn);color:#fff}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 18px;margin:10px 0}
details summary{cursor:pointer;font-weight:700}
details[open] summary{margin-bottom:8px}

.bar{display:flex;align-items:center;gap:12px;margin:8px 0}
.bar b{width:150px;flex:none;font-size:16px}
.bar .tr{flex:1;background:var(--soft);border-radius:6px;height:20px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--btn);border-radius:6px}
.bar .tr i.gold{background:var(--gold)}
.bar em{font-style:normal;font-weight:700;width:52px;text-align:right;font-variant-numeric:tabular-nums}

.tiles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.tile{min-width:52px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);text-align:center;font:700 22px var(--f-mono);background:var(--bg)}
.tile small{display:block;font:400 13px var(--f-body);color:var(--ink-2)}
.tile.ok{border-color:var(--good);background:var(--good-soft)}
.tile.no{border-color:var(--bad);background:var(--bad-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{appearance:none;width:46px;height:46px;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px var(--f-body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:12px 0}
.mech{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;color:var(--ink);font:inherit}
.mech[aria-expanded="true"]{border-color:var(--btn);background:var(--soft)}
.mech b{font:700 19px var(--f-display);display:block;margin-bottom:4px}
.mech .more{display:none;margin-top:8px;font-size:16px}
.mech[aria-expanded="true"] .more{display:block}
.chart{width:100%;height:auto;display:block;color:var(--ink-2)}
.hm{display:flex;gap:14px;align-items:flex-end;height:150px;margin:12px 0 4px}
.hm div{flex:1;background:var(--btn);border-radius:8px 8px 0 0;color:#fff;font-weight:700;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-size:15px}
.steps{padding-left:22px}
.steps li{margin:4px 0}
.checks label{display:flex;gap:10px;align-items:center;font-weight:400;margin:6px 0}
.checks input{width:22px;height:22px;flex:none}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:32px}
.words{columns:2;column-gap:32px;font:600 22px var(--f-mono);margin:12px 0;padding:0;list-style:none}
.words li{margin:4px 0}
.card-q{font:700 24px var(--f-display);margin:12px 0 16px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:12px 16px}
  .rail .sub,.rail .prog{display:none}
  .brand{margin-bottom:8px}
  .rail ol{display:flex;gap:4px;overflow-x:auto}
  .rail ol::before{display:none}
  .rail li a{flex-direction:column;gap:4px;padding:4px 8px;font-size:12px;min-width:66px;text-align:center}
  .bar b{width:96px}
  .map a{grid-template-columns:40px 1fr}
  .map .pill{grid-column:2}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" aria-label="Memory pipeline">
    <a class="brand" href="#home">Memory Lab</a>
    <p class="sub">Follow the information from your senses to long-term memory.</p>
    <ol id="railList"></ol>
    <p class="prog" id="railProg"></p>
  </nav>
  <main id="stage" tabindex="-1"></main>
</div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const frame = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(() => r())));
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const CONS = "BCDFGHJKLMNPQRSTVWXZ".split("");
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));

let token = 0; /* changes on every route so old timers stop touching the page */
let state = { done: {} };

/* countdown with a bar and a readout; resolves true at zero, false if the page moved on */
function countdown(bar, text, secs, t) {
  return new Promise(res => {
    const end = Date.now() + secs * 1000;
    if (bar) { bar.style.transition = "none"; bar.style.width = "100%"; void bar.offsetWidth; bar.style.transition = "width " + secs + "s linear"; bar.style.width = "0%"; }
    if (text) text.textContent = secs + " s";
    const iv = setInterval(() => {
      if (t !== token) { clearInterval(iv); res(false); return; }
      if (text) text.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)) + " s";
      if (Date.now() >= end) { clearInterval(iv); res(true); }
    }, 200);
  });
}
function onClickOnce(btn) { return new Promise(r => btn.addEventListener("click", () => r("click"), { once: true })); }
function onSubmitOnce(form) { return new Promise(r => { const h = e => { e.preventDefault(); form.removeEventListener("submit", h); r(true); }; form.addEventListener("submit", h); }); }
const letters = s => (String(s).toUpperCase().match(/[A-Z]/g) || []);
function scoreWords(text, words) {
  const norm = w => w.replace(/s$/, "");
  const toks = new Set((String(text).toLowerCase().match(/[a-z]+/g) || []).map(norm));
  return words.filter(w => toks.has(norm(w))).length;
}
function bars(rows, max) {
  return rows.map(r => `<div class="bar"><b>${esc(r.label)}</b><div class="tr"><i class="${r.gold ? "gold" : ""}" style="width:${Math.round(100 * r.value / max)}%"></i></div><em>${r.value}/${max}</em></div>`).join("");
}

/* ---------- stations ---------- */
const STATIONS = [
  { id: "sensory", n: 1, name: "Sensory memory", short: "Senses", min: 6, d: "Flash a grid of letters and catch what your eyes hold for a split second.", render: renderSensory },
  { id: "working", n: 2, name: "Working memory", short: "Working", min: 9, d: "Stretch your digit span, chunk a string, and watch a memory fade in 18 seconds.", render: renderWorking },
  { id: "devices", n: 3, name: "Memory devices", short: "Devices", min: 15, d: "Rote against story, build an acrostic and a memory palace, and plan your spacing.", render: renderDevices },
  { id: "vault", n: 4, name: "The long-term vault", short: "Vault", min: 9, d: "Sort real memories, meet a famous patient, and try to explain tying a shoe.", render: renderVault },
  { id: "pressure", n: 5, name: "Memory under pressure", short: "Pressure", min: 8, d: "Slide the stress dial, then test your recall against a countdown.", render: renderPressure },
  { id: "boss", n: 6, name: "Boss round", short: "Boss", min: 5, d: "Twelve questions across every station.", render: renderBoss },
];
const stationName = id => (STATIONS.find(s => s.id === id) || {}).name || id;

function head(n, title, kicker) {
  return `<header class="st-head"><span class="num" aria-hidden="true">${String(n).padStart(2, "0")}</span><div><p class="eyebrow">${kicker}</p><h2>${title}</h2></div></header>`;
}
function pager(id) {
  const i = STATIONS.findIndex(s => s.id === id);
  const prev = i > 0 ? STATIONS[i - 1] : null, next = i < STATIONS.length - 1 ? STATIONS[i + 1] : null;
  return `<div class="pager">${prev ? `<a class="btn ghost" href="#${prev.id}">Back: ${esc(prev.name)}</a>` : `<a class="btn ghost" href="#home">Back to the map</a>`}${next ? `<a class="btn" href="#${next.id}">Next: ${esc(next.name)}</a>` : `<a class="btn" href="#home">Back to the map</a>`}</div>`;
}
function markDone(id) { state.done[id] = true; updateRail(); }
function updateRail(current) {
  const cur = current || (location.hash || "#home").slice(1);
  $("#railList").innerHTML = STATIONS.map(s => `<li class="${state.done[s.id] ? "done" : ""} ${cur === s.id ? "current" : ""}"><a href="#${s.id}" ${cur === s.id ? 'aria-current="page"' : ""}><span class="dot">${state.done[s.id] ? "&#10003;" : s.n}</span>${esc(s.short)}</a></li>`).join("");
  const n = Object.keys(state.done).length;
  $("#railProg").textContent = n + " of " + STATIONS.length + " stations checked off";
}

/* ---------- quick check component ---------- */
function quickCheck(host, qs, opts) {
  opts = opts || {};
  const items = qs.map(q => ({ ...q, order: shuffle(q.o.map((_, i) => i)) }));
  let answered = 0, right = 0; const missed = [];
  host.innerHTML = `<h3>${esc(opts.title || "Quick check")}</h3>` +
    items.map((q, i) => `<fieldset class="q" data-i="${i}"><legend>${i + 1}. ${esc(q.q)}</legend>${q.order.map(oi => `<button type="button" class="opt" data-o="${oi}">${esc(q.o[oi])}</button>`).join("")}<p class="fb" aria-live="polite"></p></fieldset>`).join("") +
    `<div class="qc-end" aria-live="polite"></div>`;
  host.addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b) return;
    const fs = b.closest(".q"); if (fs.dataset.done) return;
    fs.dataset.done = "1";
    const q = items[+fs.dataset.i], oi = +b.dataset.o, ok = oi === q.a;
    $$(".opt", fs).forEach(x => { if (+x.dataset.o === q.a) x.classList.add("right"); });
    if (!ok) b.classList.add("wrong");
    $(".fb", fs).innerHTML = ok ? `<b class="ok">Yes.</b> ${esc(q.why || "")}` : `<b class="no">Not quite.</b> ${esc(q.why || "")}`;
    answered++; if (ok) right++; else missed.push(q.s || opts.station);
    if (answered === items.length) {
      const end = $(".qc-end", host);
      if (opts.onDone) opts.onDone({ right, total: items.length, missed, end });
      else {
        markDone(opts.station);
        end.innerHTML = `<p class="out">Station complete: ${right} of ${items.length} correct.</p>`;
      }
    }
  });
}

/* ---------- home ---------- */
function renderHome(el) {
  el.innerHTML = `
  <section class="hero">
    <p class="eyebrow">Psychology elective &middot; Memory, round two</p>
    <h1>Memory Lab</h1>
    <p class="lede">You have seen the model. Now run it on your own brain. Each station has a short experiment, a deeper look at one idea from the slideshow, and a quick check.</p>
    <div class="row"><a class="btn" href="#sensory">Start at station 1</a><span class="muted">About 50 minutes in all. Every station also works on its own.</span></div>
  </section>
  <section class="map" aria-label="Stations">
    ${STATIONS.map(s => `<a href="#${s.id}"><span class="n">${String(s.n).padStart(2, "0")}</span><span><b>${esc(s.name)}</b><span class="d">${esc(s.d)}</span></span><span class="pill ${state.done[s.id] ? "done" : ""}">${state.done[s.id] ? "Checked off" : s.min + " min"}</span></a>`).join("")}
  </section>
  <details>
    <summary>For the teacher</summary>
    <p><b>Running it.</b> Works on a projector for the whole class or on individual devices. Nothing is saved or sent anywhere, and a refresh clears progress.</p>
    <p><b>Class data.</b> Have students call out scores for three comparisons: whole-grid against cued-row (station 1), rote against story (station 3), and calm against countdown (station 5). Then ask what a fair experiment would need that one trial each does not have: more trials, random order, and more people.</p>
    <p><b>Beyond the slideshow.</b> Station 1 adds Sperling's partial-report method. Station 2 adds the newer estimate of about four chunks and the 18-second fade test. Station 3 adds the method of loci and a spacing model. Station 4 adds the patient H.M. and the idea that implicit memory also includes priming. Station 5 adds the Yerkes&ndash;Dodson curve and the effect of task difficulty.</p>
  </details>`;
}

/* ---------- 1. sensory ---------- */
function renderSensory(el) {
  el.innerHTML = head(1, "Sensory memory", "Station 1 &middot; Blink and it is gone") + `
  <div class="prose"><p>Everything your senses pick up lands here first. Sensory memory holds a huge amount for almost no time: about half a second for sights (<b>iconic</b> memory) and about three to four seconds for sounds (<b>echoic</b> memory). Only what you pay attention to moves on to working memory.</p></div>
  <div class="depth"><h3>Go deeper: Sperling's letters</h3>

    const a = ret(14, ds), b = ret(30, ds);

      const stations = [...new Set(missed)].filter(Boolean);
      const grade = right >= 11 ? "Memory master" : right >= 8 ? "Solid" : "Worth another lap";
      end.innerHTML = `<p class="big">${right} / ${total}</p><p class="out">${grade}.</p>` + (stations.length ? `<p>Revisit: ${stations.map(s => `<a href="#${s}">${esc(stationName(s))}</a>`).join(", ")}.</p>` : `<p>Nothing to revisit. Test yourself again in a few days, because that is how this stays put.</p>`) + `<div class="row"><button class="btn ghost" id="bossAgain">Take it again</button></div>`;
      $("#bossAgain", end).onclick = () => renderBoss(el);
    },
  });
}

/* ---------- router ---------- */
function route() {
  token++;
  const id = (location.hash || "#home").slice(1), st = STATIONS.find(s => s.id === id), el = $("#stage");
  el.innerHTML = "";
  if (st) st.render(el); else renderHome(el);
  updateRail(st ? id : "home");
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => state);
const start = d => { if (d && d.done) state = d; route(); };
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start); else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
